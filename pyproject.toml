[project]
name = "resource-allocator"
version = "0.1.0"
description = "Reserve memory, CPU, GPU and disk on a shared machine, run a command, and release the reservation when it exits."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.scripts]
alloc = "alloc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloc"]
